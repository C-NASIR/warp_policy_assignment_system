[project]
name = "warp-policy-assignment-system"
version = "0.1.0"
description = "Date-effective workforce policy assignment and reconciliation service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.28.1",
    # The repository-level type checker may use the backend environment while
    # analyzing the sibling MCP service.
    "mcp>=2.2.0,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
