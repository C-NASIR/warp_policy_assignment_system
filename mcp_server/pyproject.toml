[project]
name = "policyos-mcp"
version = "0.1.0"
description = "MCP adapter for the PolicyOS HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
policyos-mcp = "policyos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyos_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
root = ["./src"]
